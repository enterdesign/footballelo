name: Update & deploy

on:
  schedule:
    - cron: "17 5 * * *"        # every day 05:17 UTC
    - cron: "17 11 * * *"       # backup: only runs if the morning run did not happen (see the gate job)
  workflow_dispatch:            # manual "Run workflow" button
  push:
    branches: [main]
    paths: ["data/**", "site/**", "scripts/**", ".github/workflows/update.yml"]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: g
        run: |
          run=true
          # the backup schedule does nothing when today's morning run already checked the data
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "17 11 * * *" ]; then
            if grep -q "\"synced\":\"$(date -u +%F)" data/sync.json; then
              run=false
              echo "The morning run already happened today - skipping the backup run."
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: python -m unittest discover -s tests

      - name: Fetch new matches
        if: github.event_name != 'push'
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: python scripts/sync.py

      - name: Build site data
        id: build
        run: |
          set +e
          python scripts/build.py --record 2>&1 | tee build.log
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Check that the sources still deliver matches
        if: github.event_name != 'push' && steps.build.outputs.status == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=0
          python scripts/freshness.py > freshness.log || status=$?
          cat freshness.log
          if [ "$status" = "3" ] && [ -z "$(gh issue list --state open --search 'No new matches from some sources in:title' --json number --jq '.[].number')" ]; then
            { echo "A running competition has had no new matches for more than three weeks, so a source may have changed its format or stopped updating:"
              echo; echo '```'; cat freshness.log; echo '```'
              echo; echo "What to check: docs/TROUBLESHOOTING.md (in Polish), section 'No new matches'. The site keeps showing the last good data meanwhile."; } > fresh.md
            gh issue create --title "No new matches from some sources" --body-file fresh.md
          fi

      - name: Open issue for unknown team names
        if: steps.build.outputs.status == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "The daily update found team names that are not in \`data/teams_*.json\`."
            echo "Add each one as an alias of an existing team (or as a new team) and the next run will pick it up. Examples: docs/TROUBLESHOOTING.md (in Polish), section 'Unknown team names'."
            echo; echo '```'; cat build.log; echo '```'; } > issue.md
          gh issue create --title "Unknown team names in daily update" --body-file issue.md
          exit 1

      - name: Fail on other build errors
        if: steps.build.outputs.status != '0' && steps.build.outputs.status != '2'
        run: exit 1

      - name: Commit new matches
        if: github.event_name != 'push'
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "Daily update: new matches"
            git pull --rebase origin main
            git push
          fi

      - name: Version static assets (browsers keep app.js / style.css for minutes otherwise)
        run: sed -i "s#app.js#app.js?v=${GITHUB_SHA::8}#; s#style.css#style.css?v=${GITHUB_SHA::8}#" site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
