name: probe
on:
  push:
    branches: [claude/adoring-knuth-4bh23x]
    paths: [".github/workflows/probe.yml"]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          get() { curl -s -A "footballelo/1.0" "https://en.wikipedia.org/w/api.php?action=query&prop=revisions&rvprop=content&rvslots=main&format=json&formatversion=2&titles=$1" | python3 -c "import sys,json;print(json.load(sys.stdin)['query']['pages'][0].get('revisions',[{}])[0].get('slots',{}).get('main',{}).get('content','MISSING'))"; }
          get "2026%E2%80%9327_UEFA_Nations_League_A" > a.txt || true
          get "2024%E2%80%9325_UEFA_Nations_League_A" > o.txt || true
          wc -c a.txt o.txt
          echo "== templates 2026"; grep -o -i "{{[A-Za-z#: ]*" a.txt | sort | uniq -c | sort -rn | head -15 || true
          echo "== templates 2024"; grep -o -i "{{[A-Za-z#: ]*" o.txt | sort | uniq -c | sort -rn | head -15 || true
          echo "== 2026 excerpt"; grep -n -i -m3 "matchday\|Football box\|#invoke" a.txt || true
          sed -n '/Matches/,+40p' a.txt | head -60 || true
