name: probe
on:
  push:
    branches: [claude/adoring-knuth-4bh23x]
    paths: [".github/workflows/probe.yml"]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd scripts && python3 - <<'PY'
          import json, nl_wikipedia, nationsleague
          from common import DATA, alias_map
          ms = nl_wikipedia.fetch_running()
          print(len(ms), "matches")
          for m in ms[:6] + ms[-4:]: print(m)
          amap = alias_map(json.loads((DATA/"teams_nl.json").read_text()))
          print("unknown:", sorted({t for m in ms for t in (m["teamA"], m["teamB"]) if t not in amap}))
          PY
