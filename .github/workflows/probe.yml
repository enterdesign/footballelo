name: probe
on:
  push:
    branches: [claude/adoring-knuth-4bh23x]
    paths: [".github/workflows/probe.yml"]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd scripts && python3 - <<'PY'
          import re, nl_wikipedia as w
          titles = ["2018–19 UEFA Europa League", "2018–19 UEFA Europa League group stage", "2018–19 UEFA Europa League knockout phase",
                    "2009–10 UEFA Europa League", "2009–10 UEFA Europa League group stage", "2009–10 UEFA Europa League knockout phase",
                    "2025–26 UEFA Europa League league phase", "2025–26 UEFA Europa League knockout phase",
                    "2021–22 UEFA Europa Conference League group stage", "2021–22 UEFA Europa Conference League knockout phase",
                    "2025–26 UEFA Conference League league phase", "2025–26 UEFA Conference League knockout phase",
                    "2025–26 UEFA Europa League", "2025–26 UEFA Conference League"]
          for t in titles:
              try: p = w.page_html(t)
              except Exception as e: print(t, "ERR", e); continue
              if not p: print(t, "MISSING"); continue
              boxes = w.parse_boxes(p)
              heads = re.findall(r'<h([2-4])[^>]*>(.*?)</h\1>', p, re.S)
              hs = [re.sub(r'<[^>]+>', '', h[1]).strip() for h in heads]
              print("==", t, "len", len(p), "footballbox", p.count('class="footballbox"'), "parsed", len(boxes))
              print("   headings:", hs[:30])
              if boxes: print("   sample:", boxes[0], boxes[-1])
          PY
