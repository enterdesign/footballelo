name: Import Ekstraklasa (one-off)

on:
  workflow_dispatch:
  push:
    branches: [claude/adoring-knuth-4bh23x]
    paths: [".github/workflows/probe.yml", "scripts/probe_pl.py"]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Look at the seasons that did not parse
        run: python scripts/probe_pl.py
