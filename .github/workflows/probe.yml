name: probe
on:
  push:
    branches: [claude/adoring-knuth-4bh23x]
    paths: [".github/workflows/probe.yml"]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - env:
          K: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: |
          echo "== competitions"
          curl -s -H "X-Auth-Token: $K" https://api.football-data.org/v4/competitions | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          for c in d.get('competitions',[]): print(c['code'],c['name'],c.get('plan'))"
          echo "== NL candidates"
          for c in UNL NL UNL1 UEFANL; do echo $c; curl -s -H "X-Auth-Token: $K" "https://api.football-data.org/v4/competitions/$c/matches?season=2026" | head -c 300; echo; done
          echo "== wikipedia"
          curl -s -A "footballelo/1.0" "https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=2026%E2%80%9327+UEFA+Nations+League&format=json&srlimit=3" | head -c 600
