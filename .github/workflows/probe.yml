name: probe
on:
  push:
    branches: [claude/adoring-knuth-4bh23x]
    paths: [".github/workflows/probe.yml"]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd scripts && python3 - <<'PY'
          import json, collections
          import sync, nl_wikipedia, build, common
          ms = nl_wikipedia.fetch_running()
          print("wiki matches:", len(ms))
          for m in ms[:3] + ms[-3:]: print(m)
          nl = sync.refresh_nl()
          print("total:", len(nl), nl[-1])
          sync.dump(common.DATA / "matches/nl.json", nl)
          out, bad = build.build("nl")
          print("unknown:", bad)
          if out:
              c = collections.Counter(m[1] for m in out["matches"] if m[0] == "2026/27"); print("2026/27 phases:", dict(c))
              for t in out["teams"][:8]: print(t["name"], t["elo"], t["matches"], t.get("division"))
          PY
# rerun
