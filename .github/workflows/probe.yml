name: probe
on:
  push:
    branches: [probe-seriea]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: La Liga around the Clasico (football-data.org)
        env:
          K: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: |
          curl -s -H "X-Auth-Token: $K" "https://api.football-data.org/v4/competitions/PD/matches?season=2026&dateFrom=2026-10-23&dateTo=2026-10-27" > pd.json || true
          python3 - <<'P'
          import json
          d=json.load(open("pd.json"))
          for m in sorted(d.get("matches",[]),key=lambda m:m["utcDate"]):
              s=m["score"]
              print(m["utcDate"],m["status"],m["stage"],m["matchday"],m["homeTeam"]["name"],"-",m["awayTeam"]["name"],s["fullTime"],s.get("duration"),"upd",m["lastUpdated"])
          P
