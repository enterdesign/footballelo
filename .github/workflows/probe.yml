name: probe
on:
  push:
    branches: [claude/adoring-knuth-4bh23x]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Import Europa League and Conference League
        run: python scripts/import_uefa.py --init-teams --report data/uefa_import_report.txt
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Import Europa League and Conference League from Wikipedia" || exit 0
          git pull --rebase origin claude/adoring-knuth-4bh23x
          git push origin HEAD:claude/adoring-knuth-4bh23x
