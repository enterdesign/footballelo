name: probe
on:
  push:
    branches: [claude/adoring-knuth-4bh23x]
    paths: [".github/workflows/probe.yml"]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd scripts && python3 - <<'PY'
          import re, nl_wikipedia as w
          for t in ["2026–27 UEFA Nations League A", "2024–25 UEFA Nations League A"]:
              p = w.page_html(t)
              print(t, None if p is None else len(p))
              if p:
                  i = p.find('footballbox')
                  print(i, p.count('footballbox'))
                  print(p[i-20:i+2200])
                  print(len(w.parse_boxes(p)))
          PY
