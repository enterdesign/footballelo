name: Import Ekstraklasa (one-off)

on:
  workflow_dispatch:
  push:
    branches: [claude/adoring-knuth-4bh23x]
    paths: [".github/workflows/probe.yml"]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Import all seasons from Wikipedia
        run: |
          mkdir -p data
          python scripts/import_ekstraklasa.py --init-teams --report data/ekstraklasa_import_report.txt
      - name: Commit result to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Import Ekstraklasa seasons from Wikipedia" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
