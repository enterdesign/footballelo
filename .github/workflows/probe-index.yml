name: probe-index
on:
  push:
    branches: [probe-seriea]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Sitemap as a crawler sees it
        run: |
          U=https://enterdesign.github.io/footballelo/sitemap.xml
          GB='Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)'
          echo "--- GET with Googlebot UA, following redirects"
          curl -sSL -A "$GB" -D - -o /tmp/g.xml -w 'final=%{url_effective} http=%{http_code} size=%{size_download} redirects=%{num_redirects} time=%{time_total}\n' $U | grep -i -E '^(HTTP|content-type|content-length|content-encoding|cache-control|last-modified|location|x-robots|final)'
          echo "--- HEAD"
          curl -sSI -A "$GB" $U | grep -i -E '^(HTTP|content-type|content-length|x-robots)'
          echo "--- same bytes as plain GET: $(curl -s $U | md5sum | cut -c1-8) vs $(md5sum < /tmp/g.xml | cut -c1-8)"
          echo "--- xmllint"; sudo apt-get -qq install -y libxml2-utils >/dev/null 2>&1; xmllint --noout /tmp/g.xml && echo valid-xml
          echo "--- head of file (hex)"; head -c 60 /tmp/g.xml | xxd | head -4
          echo "--- host variants"
          for h in http://enterdesign.github.io/footballelo/sitemap.xml https://enterdesign.github.io/footballelo/sitemap.xml/ https://enterdesign.github.io/sitemap.xml; do echo "$h -> $(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' $h)"; done
