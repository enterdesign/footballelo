name: probe-index
on:
  push:
    branches: [probe-seriea]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Live ranking pages
        run: |
          B=https://enterdesign.github.io/footballelo
          curl -s $B/sitemap.xml -o /tmp/s.xml
          echo "sitemap urls: $(grep -o '<loc>' /tmp/s.xml | wc -l)"
          bad=0
          for u in $(grep -o '<loc>[^<]*' /tmp/s.xml | sed 's/<loc>//'); do
            code=$(curl -s -o /tmp/p.html -w '%{http_code}' "$u")
            t=$(grep -o '<title>[^<]*' /tmp/p.html | head -1 | sed 's/<title>//')
            c=$(grep -c 'rel="canonical"' /tmp/p.html)
            [ "$code" != 200 ] && bad=$((bad+1))
            echo "$code | ${#t} | canon=$c | ${u#$B} | $t"
          done
          echo "non-200: $bad"
          echo "robots.txt: $(curl -s -o /dev/null -w '%{http_code}' $B/robots.txt)"
