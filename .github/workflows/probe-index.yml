name: probe-index
on:
  push:
    branches: [probe-seriea]
    paths: ['.github/workflows/probe-index.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Live recent.json
        run: |
          B=https://enterdesign.github.io/footballelo
          curl -s "$B/data/meta.json" ; echo
          curl -s "$B/data/recent.json" -o /tmp/r.json -w 'recent.json HTTP %{http_code} size %{size_download}\n'
          python3 - <<'PY'
          import json
          r = json.load(open("/tmp/r.json"))
          for b in r["batches"][:4]:
              bl = [(m["a"], m["s"], m["b"]) for m in b["matches"] if m["c"] == "bundesliga"]
              print(b["at"], len(b["matches"]), "bundesliga:", bl)
          PY
