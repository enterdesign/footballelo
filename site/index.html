<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football ELO Rankings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
</head>
<body>
<div id="home" hidden>
  <div class="hero" style="min-height:220px"><div class="hero-bg" style="background-image:url('img/home.jpg')"></div><div class="hero-overlay"></div>
    <div class="hero-inner"><div class="eyebrow">Football</div><div class="title">ELO <span>Rankings</span></div><div class="subtitle">Champions League · World Cup · Premier League</div></div></div>
  <div class="cards" id="home-cards"></div>
</div>
<div id="comp" hidden>
  <div class="hero"><div class="hero-bg" id="comp-bg"></div><div class="hero-overlay"></div>
    <div class="hero-inner"><a class="back-link" href="#">← All rankings</a><div class="eyebrow" id="eyebrow"></div>
      <div class="title">ELO <span>Ranking</span></div><div class="subtitle" id="subtitle"></div></div>
    <div class="hero-stats"><span id="stats" style="display:contents"></span></div></div>
  <div id="tabs-bar"><div id="tabs"></div></div>
  <main id="view"></main>
</div>
<footer><a id="admin-dots" href="https://github.com/enterdesign/footballelo/edit/main/data/overrides.json" title="Edit data">···</a></footer>
<script src="app.js" defer></script>
</body>
</html>
